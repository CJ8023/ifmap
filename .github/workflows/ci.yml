name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # core 的字节码目标是 Java 8，因此用 8 编译必须也能通过。
        # Spring Boot 3 模块（starter / admin-starter / demo-sb3，release=17）由父 POM 的
        # <jdk>[17,)</jdk> 剖面自动装卸：JDK 8/11 上不参与构建，无需在 CI 里写分支。
        java: [ '8', '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test
        run: mvn -B -ntp clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

