name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # core 的字节码目标是 Java 8，因此用 8 编译必须也能通过。
        # Spring Boot 3 模块（starter / admin-starter / demo-sb3，release=17）由父 POM 的
        # <jdk>[17,)</jdk> 剖面自动装卸：JDK 8/11 上不参与构建，无需在 CI 里写分支。
        java: [ '8', '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test
        # 含 SpotBugs（绑定 verify；JDK 11+ 才启用，因为 SpotBugs 4.8.x 运行时要求 Java 11）
        run: mvn -B -ntp clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  static-analysis:
    name: static analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SpotBugs (effort=max, threshold=medium)
        # 单独跑一遍是为了让“静态分析挂了”在 CI 里一眼可见（build 矩阵里的 verify 也会跑它）。
        # 用 verify（而不是直接 spotbugs:check）保证编译、依赖、插件版本与矩阵里完全一致。
        run: mvn -B -ntp -DskipTests verify

  docs:
    name: docs site (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs-material
        run: pip install -r docs-requirements.txt

      - name: Build docs (warnings are errors)
        # 建站本身不参与 Maven 构建，但它必须能过 --strict：文档里的相对链接写错就挂
        run: mkdocs build --strict

  # ---------------------------------------------------------------
  # 真库双跑：MySQL 5.7 与 8.0。
  # ifmap-testkit 提供单入口档位开关：
  #   不设 IFMAP_JDBC_URL → 全部测试仍跑 H2（开发机/本 job 之外都走这条）
  #   设了 IFMAP_JDBC_URL → 同一套用例改跑真库，表名换成本用例专属的 itt_<用例名>_<hex>_ 前缀
  # 真库只提供「一个库」，所以隔离靠表前缀而不是建库（测试也不建库/不删库）。
  # 残留表由 TestDataCleanupListener（JUnit 会话结束）+ 30 分钟陈旧表清扫兜底，
  # job 结束前会再查一次 information_schema，确认没有 itt_* 漏网。
  # ---------------------------------------------------------------
  integration:
    name: integration (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: [ '5.7', '8.0' ]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ifmap_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      # -am：testkit / 各 starter 直接从 reactor 构建，无需先 install
      - name: run tests against MySQL
        run: mvn -B -ntp -pl ifmap-testkit,ifmap-provider-jdbc,ifmap-spring-boot-starter,ifmap-admin-spring-boot-starter,ifmap-demo-spring-boot3 -am test
        env:
          IFMAP_JDBC_URL: jdbc:mysql://127.0.0.1:3306/ifmap_test
          IFMAP_JDBC_USER: root
          IFMAP_JDBC_PASSWORD: root
      # 清理兜底必须真的生效：残留的 itt_* 表 = 只跑了半个生命周期，这里当门禁卡住
      - name: assert no leftover itt_* tables
        run: |
          if ! command -v mysql >/dev/null; then
            echo "::warning::runner 上没有 mysql 客户端，跳过残留表检查"
            exit 0
          fi
          left=$(mysql -h127.0.0.1 -uroot -proot -N -B ifmap_test -e \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='ifmap_test' AND table_name LIKE 'itt\\_%'")
          if [ -n "$left" ]; then
            echo "::error::真库测试残留表未清理：$left"
            exit 1
          fi
          echo "OK：无 itt_* 残留表"
