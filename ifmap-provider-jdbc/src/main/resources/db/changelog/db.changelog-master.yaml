# ifmap 建表脚本主入口（Liquibase）
#
# 使用方式（Spring Boot 3）：
#   spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
#   spring.liquibase.parameters.tablePrefix=ifmap_      # 默认 ifmap_；复用存量表时填 bankint_
#
# 纯 Java / 不用 Liquibase 时：把 v1.0.0/*.sql 里的 ${tablePrefix} 全局替换为实际前缀后手工执行。
databaseChangeLog:
  - property:
      name: tablePrefix
      value: ifmap_
  - include:
      file: db/changelog/v1.0.0/001-create-ifmap-config.sql
  - include:
      file: db/changelog/v1.0.0/002-create-logic-branch.sql
  - include:
      file: db/changelog/v1.0.0/003-create-execution-log.sql
  - include:
      file: db/changelog/v1.0.0/004-create-config-history.sql
  # 005/006 是「存量库升级」changeset（ALTER，不是 CREATE）：新库按顺序执行同样落到同一份结构。
  # 复用存量表且存量模块仍在跑的场景（tablePrefix=bankint_）要裁掉 005 里的两条 DROP，见文件内注释。
  - include:
      file: db/changelog/v1.0.0/005-config-result-judge.sql
  - include:
      file: db/changelog/v1.0.0/006-execution-log-judge-columns.sql
  - include:
      file: db/changelog/v1.0.0/007-config-call-direction.sql
  # 008/009/010 是逻辑分支判定换血（flag+value → branch_judge）。
  # 009 是数据回填（MySQL 语法，临时表 + JSON_QUOTE），新库执行也是空跑。
  # 复用存量表且存量模块仍在跑的场景（tablePrefix=bankint_）要注释掉 010，见文件内注释。
  - include:
      file: db/changelog/v1.0.0/008-logic-branch-branch-judge.sql
  - include:
      file: db/changelog/v1.0.0/009-backfill-branch-judge.sql
  - include:
      file: db/changelog/v1.0.0/010-drop-logic-branch-legacy.sql
